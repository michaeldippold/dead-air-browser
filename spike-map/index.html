<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dead Air — map spike</title>
  <link rel="stylesheet" href="./src/spike.css">
</head>
<body>
  <div id="map"></div>
  <div id="vignette"></div>

  <div id="ui">
    <div id="roster" class="panel">
      <div class="panel-title">UNITS</div>
      <div id="roster-rows"></div>
      <div class="hint" id="hint">Select a unit, then click a district (or any road) to dispatch.</div>
    </div>

    <div id="place" class="panel" hidden>
      <div class="panel-title" id="place-name">—</div>
      <div class="kv" id="place-meta"></div>
    </div>

    <div id="danger" class="panel">
      <div class="panel-title">DANGER (dev)</div>
      <div id="danger-rows"></div>
    </div>

    <div id="tip" hidden></div>
    <div id="attrib">© OpenStreetMap contributors · Protomaps</div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
